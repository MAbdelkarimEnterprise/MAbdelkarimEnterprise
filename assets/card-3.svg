<svg xmlns="http://www.w3.org/2000/svg" width="380" height="200" viewBox="0 0 380 200" role="img" aria-label="46.85 seconds in the 100 back, 7th at the 2026 NCAA Division II Championships">
  <style>
    .n{font-family:'Instrument Serif','Times New Roman',Times,Georgia,serif;font-size:96px}
    .l{font-family:'Jost',Futura,'Avenir Next',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:17px;letter-spacing:1px}
    .s{font-family:'Jost',Futura,'Avenir Next',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;opacity:.78}
    @media (max-width:200px){.n{font-size:104px}.l{font-size:30px}.s{display:none}}
  </style>
  <rect width="380" height="200" rx="12" fill="#C9B7A5"/>
  <g fill="#2B1F18">
    <text class="n" x="28" y="112">46.85</text>
    <text class="l" x="30" y="150">seconds, 100 back</text>
    <text class="s" x="30" y="176">7th · 2026 NCAA Division II Championships</text>
  </g>
</svg>
